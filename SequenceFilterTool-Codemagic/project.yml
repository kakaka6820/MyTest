name: SequenceFilterTool
options:
  bundleIdPrefix: com.mengqingfeng
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: RHY63J3JL2
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_TESTABILITY: YES
targets:
  SequenceFilterTool:
    type: application
    platform: iOS
    sources:
      - path: SequenceFilterTool
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.mengqingfeng.SequenceFilterTool
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: mustwin
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    scheme:
      testTargets:
        - SequenceFilterToolTests
  SequenceFilterToolTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SequenceFilterToolTests
    dependencies:
      - target: SequenceFilterTool
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mengqingfeng.SequenceFilterToolTests
        GENERATE_INFOPLIST_FILE: YES
